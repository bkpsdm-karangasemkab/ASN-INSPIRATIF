<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Usul ASN Inspiratif</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <style>
        body { font-family: 'Inter', sans-serif; }
        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        /* Custom scrollbar untuk tabel */
        ::-webkit-scrollbar { height: 8px; width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px;}
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-gradient-to-br from-indigo-50 via-white to-blue-50 min-h-screen text-slate-800 antialiased p-4 md:p-8">

    <div class="max-w-6xl mx-auto">
        

        <main class="flex flex-col gap-10">
            <!-- Bagian Atas: Form Usulan -->
            <div class="w-full max-w-3xl mx-auto">
                <div class="glass-panel rounded-2xl shadow-xl shadow-indigo-100/50 p-6 md:p-8">
                    <h2 class="text-xl font-semibold mb-6 flex items-center gap-2">
                        <i class="ph ph-file-text text-indigo-500"></i> Formulir Pengisian
                    </h2>
                    
                    
                    <form id="usulForm" class="space-y-5">
                        <div>
                            <label for="nip" class="block text-sm font-medium text-slate-700 mb-1">NIP (Masukkan nip dengan benar sesuai data kepegawaian BKN)</label>
                            <input type="text" id="nip" name="nip" required placeholder="Masukkan 18 digit NIP..." 
                                class="w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-slate-50 focus:bg-white focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all outline-none">
                            <div id="nipStatus" class="text-xs mt-1.5 font-medium flex items-center gap-1 hidden transition-all"></div>
                        </div>
                        
                        <div>
                            <label for="nama" class="block text-sm font-medium text-slate-700 mb-1">Nama Lengkap</label>
                            <input type="text" id="nama" name="nama" required placeholder="Masukkan nama lengkap beserta gelar" 
                                class="w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-slate-50 focus:bg-white focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all outline-none">
                        </div>

                        <div>
                            <label for="jabatan" class="block text-sm font-medium text-slate-700 mb-1">Jabatan</label>
                            <input type="text" id="jabatan" name="jabatan" required placeholder="Contoh: Analis Kebijakan Ahli Muda" 
                                class="w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-slate-50 focus:bg-white focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all outline-none">
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                            <div>
                                <label for="pangkat" class="block text-sm font-medium text-slate-700 mb-1">Pangkat/Golongan</label>
                                <input type="text" id="pangkat" name="pangkat" required placeholder="Contoh: Penata / IIIc" 
                                    class="w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-slate-50 focus:bg-white focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all outline-none">
                            </div>
                            <div>
                                <label for="tempat_tugas" class="block text-sm font-medium text-slate-700 mb-1">Tempat Tugas</label>
                                <input type="text" id="tempat_tugas" name="tempat_tugas" required placeholder="Contoh: BKD Prov. Bali" 
                                    class="w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-slate-50 focus:bg-white focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all outline-none">
                            </div>
                        </div>

                        <div>
                            <label for="keterangan" class="block text-sm font-medium text-slate-700 mb-1">Keterangan / Alasan Usulan</label>
                            <textarea id="keterangan" name="keterangan" rows="3" required placeholder="Tuliskan inovasi atau pencapaian inspiratif yang dilakukan..." 
                                class="w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-slate-50 focus:bg-white focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all outline-none resize-none"></textarea>
                        </div>

                        <button type="submit" id="btnSubmit" 
                            class="w-full py-3 px-4 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-xl shadow-lg shadow-indigo-200 transition-all flex justify-center items-center gap-2">
                            <i class="ph ph-paper-plane-tilt"></i> Kirim Usulan
                        </button>

                        <div id="alertBox" class="hidden mt-4 p-4 rounded-xl text-sm font-medium transition-all">
                            <!-- Pesan sukses/error akan muncul di sini -->
                        </div>
                    </form>
                </div>
            </div>

            <!-- Bagian Bawah: Tabel Riwayat -->
            <div class="w-full">
                <div class="glass-panel rounded-2xl shadow-xl shadow-slate-100/50 flex flex-col h-full overflow-hidden border border-slate-100">
                    
                    <!-- Header Tabel & Search -->
                    <div class="p-6 border-b border-slate-100 bg-white/50 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                        <h2 class="text-xl font-semibold flex items-center gap-2 whitespace-nowrap text-slate-800">
                            <i class="ph ph-clock-counter-clockwise text-indigo-500"></i> Riwayat Usulan
                        </h2>
                        <div class="relative w-full sm:max-w-xs">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <i class="ph ph-magnifying-glass text-slate-400"></i>
                            </div>
                            <input type="text" id="searchInput" placeholder="Cari NIP / Nama..." 
                                class="w-full pl-10 pr-4 py-2 rounded-xl border border-slate-200 bg-white focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all text-sm outline-none">
                        </div>
                    </div>
                    
                    <div class="p-6 overflow-x-auto bg-slate-50/50 rounded-b-2xl">
                        <!-- Table Wrapper -->
                        <div class="overflow-x-auto rounded-xl border border-slate-200 bg-white shadow-sm mb-4">
                            <table class="w-full text-left border-collapse table-auto">
                                <thead>
                                    <tr class="bg-slate-50 border-b border-slate-200 text-slate-500 text-xs uppercase tracking-wider">
                                        <th class="px-4 md:px-6 py-4 font-semibold w-32 whitespace-nowrap">Waktu</th>
                                        <th class="px-4 md:px-6 py-4 font-semibold whitespace-nowrap">Pegawai</th>
                                        <th class="px-4 md:px-6 py-4 font-semibold">Jabatan & Pangkat</th>
                                        <th class="px-4 md:px-6 py-4 font-semibold">Tempat Tugas</th>
                                        <th class="px-4 md:px-6 py-4 font-semibold">Alasan Usulan</th>
                                    </tr>
                                </thead>
                                <tbody id="historyContainer" class="divide-y divide-slate-100">
                                    <!-- Data baris tabel akan dimuat via JavaScript -->
                                </tbody>
                            </table>
                        </div>
                        
                        <!-- Empty State -->
                        <div id="emptyState" class="hidden flex-col items-center justify-center p-12 text-slate-400 w-full">
                            <i class="ph ph-folder-open text-5xl mb-3 text-slate-300"></i>
                            <p class="text-base font-medium text-slate-500">Belum ada usulan ditemukan</p>
                            <p class="text-sm mt-1 text-center">Silakan buat usulan melalui form atau ubah kata kunci pencarian.</p>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        // ---------------------------------------------------------
        // KONFIGURASI GOOGLE APPS SCRIPT
        // Jika Anda sudah men-deploy script backend.gs, masukkan URL Web App-nya di sini.
        // Jika dikosongkan, aplikasi akan berjalan menggunakan memori browser sementara (In-Memory).
        // ---------------------------------------------------------
        const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyyJ6cp17cmzKr7EAq1q-N7HQjGIvNf96sbhcWuMS_LJALqvL_T6RFirdMERnRV7Ep1/exec"; 
        
        // State management
        let usulanData = []; // Menyimpan semua data 
        let isSubmitting = false;

        // Elemen DOM
        const form = document.getElementById('usulForm');
        const btnSubmit = document.getElementById('btnSubmit');
        const alertBox = document.getElementById('alertBox');
        const historyContainer = document.getElementById('historyContainer');
        const searchInput = document.getElementById('searchInput');
        const emptyState = document.getElementById('emptyState');
        const nipInput = document.getElementById('nip');
        const nipStatus = document.getElementById('nipStatus');

        function formatDate(dateStr) {
            const date = new Date(dateStr);
            const options = { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' };
            return date.toLocaleDateString('id-ID', options);
        }

        // Helper untuk mendapatkan inisial nama dari string
        function getInitials(name) {
            if (!name) return "AS";
            const parts = name.split(' ').filter(p => p.length > 0);
            if (parts.length >= 2) {
                return (parts[0][0] + parts[1][0]).toUpperCase();
            }
            return name.substring(0, 2).toUpperCase();
        }

        function renderCards(dataToRender) {
            historyContainer.innerHTML = '';
            
            // Elemen pembungkus tabel
            const tableWrapper = historyContainer.closest('.overflow-x-auto.rounded-xl');

            if (dataToRender.length === 0) {
                emptyState.classList.remove('hidden');
                emptyState.classList.add('flex');
                if (tableWrapper) tableWrapper.classList.add('hidden');
            } else {
                emptyState.classList.add('hidden');
                emptyState.classList.remove('flex');
                if (tableWrapper) tableWrapper.classList.remove('hidden');
                
                dataToRender.forEach(item => {
                    const tr = document.createElement('tr');
                    tr.className = "hover:bg-indigo-50/50 transition-colors group";
                    
                    const initials = getInitials(item.nama);
                    
                    tr.innerHTML = `
                        <td class="px-4 md:px-6 py-4 text-xs text-slate-500 align-top whitespace-nowrap">
                            ${formatDate(item.timestamp)}
                        </td>
                        <td class="px-4 md:px-6 py-4 align-top whitespace-nowrap">
                            <div class="flex items-start gap-3">
                                <div class="w-10 h-10 flex-shrink-0 rounded-full bg-gradient-to-br from-indigo-100 to-blue-50 text-indigo-700 flex items-center justify-center font-bold text-sm shadow-inner border border-white mt-1">
                                    ${initials}
                                </div>
                                <div>
                                    <div class="font-semibold text-slate-800 text-sm">${item.nama}</div>
                                    <div class="text-xs text-indigo-600 font-mono mt-0.5">${item.nip}</div>
                                </div>
                            </div>
                        </td>
                        <td class="px-4 md:px-6 py-4 align-top">
                            <div class="text-sm text-slate-700 font-medium whitespace-normal">${item.jabatan}</div>
                            <div class="text-xs mt-1.5"><span class="inline-flex items-center px-2 py-0.5 rounded text-slate-600 bg-slate-100 border border-slate-200 font-medium whitespace-normal break-words text-left">${item.pangkat}</span></div>
                        </td>
                        <td class="px-4 md:px-6 py-4 text-sm text-slate-600 align-top">
                            <div class="flex items-start gap-1.5 whitespace-normal">
                                <i class="ph ph-map-pin text-rose-400 text-base mt-0.5 flex-shrink-0"></i> 
                                <span>${item.tempat_tugas}</span>
                            </div>
                        </td>
                        <td class="px-4 md:px-6 py-4 align-top">
                            <div class="text-sm text-slate-600 italic whitespace-normal group-hover:text-slate-800 transition-colors">
                                "${item.keterangan}"
                            </div>
                        </td>
                    `;
                    historyContainer.appendChild(tr);
                });
            }
        }

        searchInput.addEventListener('input', (e) => {
            const keyword = e.target.value.toLowerCase().trim();
            if (!keyword) {
                renderCards(usulanData);
                return;
            }
            
            // Filter berdasarkan NIP atau NAMA
            const filteredData = usulanData.filter(item => 
                item.nip.toLowerCase().includes(keyword) || 
                item.nama.toLowerCase().includes(keyword)
            );
            
            renderCards(filteredData);
        });

        // ---------------------------------------------------------
        // FITUR AUTO-FILL NIP
        // ---------------------------------------------------------
        nipInput.addEventListener('input', (e) => {
            const nipVal = e.target.value.trim();
            
            // Mengecek apabila NIP yang diketik mencapai 18 digit
            if (nipVal.length === 18 && !isNaN(nipVal)) {
                lookupNip(nipVal);
            } else if (nipVal.length === 0) {
                nipStatus.classList.add('hidden');
                resetPegawaiFields();
            } else {
                nipStatus.classList.remove('hidden', 'text-green-600', 'text-red-500', 'text-indigo-600');
                nipStatus.classList.add('text-slate-500');
                nipStatus.innerHTML = '<i class="ph ph-info"></i> Masukkan 18 digit NIP untuk auto-fill';
            }
        });

        function resetPegawaiFields() {
            document.getElementById('nama').value = '';
            document.getElementById('jabatan').value = '';
            document.getElementById('pangkat').value = '';
            document.getElementById('tempat_tugas').value = '';
        }

        async function lookupNip(nip) {
            nipStatus.classList.remove('hidden', 'text-green-600', 'text-red-500', 'text-slate-500');
            nipStatus.classList.add('text-indigo-600');
            nipStatus.innerHTML = '<i class="ph ph-spinner animate-spin text-base"></i> Mencari data pegawai...';

            if (GAS_WEB_APP_URL) {
                try {
                    const response = await fetch(`${GAS_WEB_APP_URL}?action=lookup&nip=${nip}`);
                    const result = await response.json();
                    
                    if(result.status === 'success') {
                        document.getElementById('nama').value = result.data.nama;
                        document.getElementById('jabatan').value = result.data.jabatan;
                        document.getElementById('pangkat').value = result.data.pangkat;
                        document.getElementById('tempat_tugas').value = result.data.tempat_tugas;
                        
                        nipStatus.classList.replace('text-indigo-600', 'text-green-600');
                        nipStatus.innerHTML = '<i class="ph ph-check-circle text-base"></i> Data ditemukan & dimuat otomatis';
                    } else {
                        resetPegawaiFields();
                        nipStatus.classList.replace('text-indigo-600', 'text-red-500');
                        nipStatus.innerHTML = '<i class="ph ph-warning-circle text-base"></i> Data tidak ditemukan di database';
                    }
                } catch (error) {
                    nipStatus.classList.replace('text-indigo-600', 'text-red-500');
                    nipStatus.innerHTML = '<i class="ph ph-x-circle text-base"></i> Gagal terhubung ke server';
                }
            } else {
                // Simulasi In-Memory (Hanya untuk preview di web ini)
                setTimeout(() => {
                    if(nip === '198001012010011001') {
                        document.getElementById('nama').value = 'Budi Santoso, S.Kom., M.Si.';
                        document.getElementById('jabatan').value = 'Pranata Komputer Ahli Madya';
                        document.getElementById('pangkat').value = 'Pembina / IVa';
                        document.getElementById('tempat_tugas').value = 'Dinas Kominfo Provinsi Bali';
                        
                        nipStatus.classList.replace('text-indigo-600', 'text-green-600');
                        nipStatus.innerHTML = '<i class="ph ph-check-circle text-base"></i> Data ditemukan (Simulasi Preview)';
                    } else {
                        resetPegawaiFields();
                        nipStatus.classList.replace('text-indigo-600', 'text-red-500');
                        nipStatus.innerHTML = `<i class="ph ph-warning-circle text-base"></i> NIP tidak ditemukan (Gunakan NIP di placeholder untuk test)`;
                    }
                }, 1000);
            }
        }

        function showAlert(message, type = 'success') {
            alertBox.classList.remove('hidden', 'bg-green-100', 'text-green-800', 'bg-red-100', 'text-red-800');
            
            if (type === 'success') {
                alertBox.classList.add('bg-green-100', 'text-green-800');
                alertBox.innerHTML = `<i class="ph ph-check-circle mr-1"></i> ${message}`;
            } else {
                alertBox.classList.add('bg-red-100', 'text-red-800');
                alertBox.innerHTML = `<i class="ph ph-warning-circle mr-1"></i> ${message}`;
            }
            
            // Hilangkan alert setelah 4 detik
            setTimeout(() => {
                alertBox.classList.add('hidden');
            }, 4000);
        }

        async function loadData() {
            if (GAS_WEB_APP_URL) {
                // Fetch dari Google Sheets (jika URL tersedia)
                historyContainer.innerHTML = '<div class="col-span-full flex flex-col items-center justify-center p-12 text-slate-400 min-h-[200px]"><i class="ph ph-spinner animate-spin text-4xl mb-3 text-indigo-500"></i><p>Memuat data profil...</p></div>';
                try {
                    const response = await fetch(GAS_WEB_APP_URL);
                    const result = await response.json();
                    if(result.status === 'success') {
                        usulanData = result.data;
                        renderCards(usulanData);
                    }
                } catch (error) {
                    console.error("Gagal memuat data dari Spreadsheet:", error);
                    showAlert("Gagal memuat riwayat usulan dari server.", "error");
                }
            } else {
                // Tampilan dummy jika belum ada backend
                renderCards(usulanData);
            }
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            if(isSubmitting) return;

            // Mengubah state tombol
            isSubmitting = true;
            btnSubmit.innerHTML = `<i class="ph ph-spinner animate-spin"></i> Memproses...`;
            btnSubmit.classList.add('opacity-70', 'cursor-not-allowed');

            // Mengambil nilai form
            const payload = {
                nip: document.getElementById('nip').value,
                nama: document.getElementById('nama').value,
                jabatan: document.getElementById('jabatan').value,
                pangkat: document.getElementById('pangkat').value,
                tempat_tugas: document.getElementById('tempat_tugas').value,
                keterangan: document.getElementById('keterangan').value
            };

            if (GAS_WEB_APP_URL) {
                // Kirim ke Google Apps Script
                try {
                    const response = await fetch(GAS_WEB_APP_URL, {
                        method: 'POST',
                        body: JSON.stringify(payload),
                        headers: {
                            'Content-Type': 'text/plain;charset=utf-8', 
                        } // text/plain digunakan untuk menghindari preflight CORS error di GAS
                    });
                    const result = await response.json();
                    
                    if(result.status === 'success') {
                        showAlert('Usulan berhasil dikirim ke Spreadsheet!');
                        form.reset();
                        loadData(); // reload tabel
                    } else {
                        showAlert('Gagal menyimpan: ' + result.message, 'error');
                    }
                } catch (error) {
                    console.error('Error:', error);
                    showAlert('Terjadi kesalahan jaringan saat mengirim data.', 'error');
                }
            } else {
                // Simulasi pengiriman data (In-Memory) agar bisa dicoba di halaman preview
                setTimeout(() => {
                    const newItem = {
                        timestamp: new Date().toISOString(),
                        ...payload
                    };
                    
                    // Menambah ke awal array
                    usulanData.unshift(newItem);
                    
                    showAlert('Usulan berhasil disimulasikan! (Mode In-Memory)');
                    form.reset();
                    
                    // Refresh tampilan berdasarkan nilai search (jika ada)
                    const keyword = searchInput.value.toLowerCase().trim();
                    if (keyword) {
                        const filtered = usulanData.filter(item => item.nip.toLowerCase().includes(keyword) || item.nama.toLowerCase().includes(keyword));
                        renderCards(filtered);
                    } else {
                        renderCards(usulanData);
                    }
                }, 800);
            }

            // Kembalikan state tombol
            setTimeout(() => {
                isSubmitting = false;
                btnSubmit.innerHTML = `<i class="ph ph-paper-plane-tilt"></i> Kirim Usulan`;
                btnSubmit.classList.remove('opacity-70', 'cursor-not-allowed');
            }, 800);
        });

        // Load data saat halaman pertama kali dibuka
        loadData();
    </script>
</body>
</html>
